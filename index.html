    <!-- Structured Data (JSON-LD) for Search Engines -->

    <title>Kenji Vargas — Full-Stack Developer</title>
    <script>
      (() => {
        let saved = null
        try { saved = localStorage.getItem('portfolio-theme') } catch { /* Storage may be disabled. */ }
        const theme = saved === 'light' || saved === 'dark'
          ? saved
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#0b0b0c' : '#f7f7f5')
      })()
    </script>
