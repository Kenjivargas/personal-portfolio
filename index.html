<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kenji Vargas — Full-Stack Developer building practical web systems. Explore verified projects (including ISMERS), technologies, and engineering background." />
    <meta name="author" content="Kenji Vargas" />
    <meta name="theme-color" content="#f5f5f5" />
    
    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kenji Vargas — Full-Stack Developer" />
    <meta property="og:description" content="Full-Stack Developer building practical web systems with React 19, Laravel, and PostgreSQL. Explore verified projects and architecture." />
    <meta property="og:site_name" content="Kenji Vargas Portfolio" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Kenji Vargas — Full-Stack Developer" />
    <meta name="twitter:description" content="Full-Stack Developer building practical web systems with React 19, Laravel, and PostgreSQL." />

    <!-- Structured Data (JSON-LD) for Search Engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Kenji Vargas",
        "jobTitle": "Full-Stack Developer",
        "description": "Full-Stack Developer building practical web systems using React, Laravel, and PostgreSQL.",
        "knowsAbout": [
          "React",
          "JavaScript",
          "Laravel",
          "PHP",
          "PostgreSQL",
          "Supabase",
          "REST APIs",
          "Role-Based Access Control",
          "System Architecture"
        ],
        "sameAs": [
          "https://github.com/kenjivargas",
          "https://linkedin.com/in/kenjivargas"
        ]
      }
    </script>

    <title>Kenji Vargas — Full-Stack Developer</title>
    <script>
      (() => {
        let saved = null
        try { saved = localStorage.getItem('portfolio-theme') } catch { /* Storage may be disabled. */ }
        const theme = saved === 'light' || saved === 'dark'
          ? saved
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#101010' : '#f5f5f5')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
